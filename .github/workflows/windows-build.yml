name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Read version
      id: version
      run: |
        $version_content = Get-Content -Path "version.py" -Raw
        if ($version_content -match '__version__ = "(.*?)"') {
            $version = $matches[1]
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
            echo "Package version: $version"
        } else {
            echo "VERSION=unknown" >> $env:GITHUB_OUTPUT
            echo "Could not read version"
        }
      shell: pwsh

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest src/tests/ -v
      continue-on-error: true

    - name: Build with PyInstaller
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $build_name = "GPXStudio_${version}_GitHubAcPy"
        pyinstaller --name $build_name --onefile --windowed --clean --noconfirm --noupx --optimize=2 --icon=res/GPXStudio.ico --add-data "src;src" --add-data "version.py;version.py" --add-data "res/GPXStudio.png;res" --add-data "res/GPXStudio.ico;res" --exclude-module "tkinter" --exclude-module "matplotlib" --exclude-module "scipy" --exclude-module "pandas" --exclude-module "IPython" --exclude-module "jupyter" --exclude-module "notebook" --hidden-import "PyQt5.sip" --hidden-import "PyQt5.QtCore" --hidden-import "PyQt5.QtGui" --hidden-import "PyQt5.QtWidgets" --hidden-import "PyQt5.QtWebEngineWidgets" --hidden-import "PyQt5.QtWebEngineCore" --hidden-import "PyQt5.QtSvg" --hidden-import "logging.handlers" --hidden-import "logging.config" --hidden-import "json" --hidden-import "requests" --hidden-import "geopy.distance" --hidden-import "geopy.geocoders" --hidden-import "gpxpy" --hidden-import "folium" --hidden-import "folium.plugins" --hidden-import "xyzservices" --hidden-import "jinja2" --hidden-import "branca" --hidden-import "core.resource_path" --hidden-import "version" --hidden-import "PyQt5.QtWebKit" --hidden-import "winrt.windows.devices.geolocation" --hidden-import "http.server" --hidden-import "socketserver" --hidden-import "tempfile" --hidden-import "threading" main.py
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GPXStudio-Windows-${{ steps.version.outputs.VERSION }}
        path: dist/GPXStudio_${{ steps.version.outputs.VERSION }}_GitHubActions.exe
